<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Carro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #game {
            position: relative;
            width: 400px;
            height: 600px;
            background: #444;
            overflow: hidden;
            border: 5px solid white;
        }

        .road-line {
            position: absolute;
            width: 10px;
            height: 80px;
            background: white;
            left: 195px;
        }

        #player {
            position: absolute;
            width: 50px;
            height: 90px;
            background: red;
            bottom: 30px;
            left: 175px;
            border-radius: 8px;
        }

        .enemy {
            position: absolute;
            width: 50px;
            height: 90px;
            background: blue;
            border-radius: 8px;
        }

        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 22px;
            z-index: 10;
        }

        #gameOver {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            padding-top: 220px;
            z-index: 20;
        }

        #gameOver h1 {
            font-size: 40px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="game">

        <div id="score">
            Pontos: 0
        </div>

        <div id="player"></div>

        <div id="gameOver">
            <h1>GAME OVER</h1>

            <p id="finalScore"></p>

            <button onclick="restartGame()">
                Jogar novamente
            </button>
        </div>

    </div>

    <!-- JavaScript externo -->
    <script src="script.js"></script>

</body>
</html>
