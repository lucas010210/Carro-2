<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo de Carro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#222;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;overflow:hidden}
#game{position:relative;width:400px;height:600px;background:#444;overflow:hidden;border:5px solid white}
.road-line{position:absolute;width:10px;height:80px;background:white;left:195px}
#player{position:absolute;width:50px;height:90px;background:red;bottom:30px;left:175px;border-radius:8px}
.enemy{position:absolute;width:50px;height:90px;background:blue;border-radius:8px}
#score{position:absolute;top:10px;left:10px;color:white;font-size:22px;z-index:10}
#gameOver{display:none;position:absolute;inset:0;background:rgba(0,0,0,.8);color:white;text-align:center;padding-top:220px;z-index:20}
#gameOver h1{font-size:40px}
button{padding:12px 25px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="game">
<div id="score">Pontos: 0</div>
<div id="player"></div>
<div id="gameOver">
<h1>GAME OVER</h1>
<p id="finalScore"></p>
<button onclick="restartGame()">Jogar novamente</button>
</div>
</div>

<script>
const player=document.getElementById("player");
const game=document.getElementById("game");
const scoreText=document.getElementById("score");

let playerX=175;
let score=0;
let speed=5;
let gameRunning=true;
const lines=[];

for(let i=0;i<6;i++){
    const line=document.createElement("div");
    line.classList.add("road-line");
    line.style.top=(i*120)+"px";
    game.appendChild(line);
    lines.push(line);
}

function createEnemy(){
    const enemy=document.createElement("div");
    enemy.classList.add("enemy");
    enemy.style.left=Math.floor(Math.random()*350)+"px";
    enemy.style.top="-100px";
    game.appendChild(enemy);
}

function collision(a,b){
    const rectA=a.getBoundingClientRect();
    const rectB=b.getBoundingClientRect();
    return !(rectA.bottom<rectB.top ||
             rectA.top>rectB.bottom ||
             rectA.right<rectB.left ||
             rectA.left>rectB.right);
}

function gameLoop(){
    if(!gameRunning)return;

    lines.forEach(line=>{
        let top=parseInt(line.style.top);
        top+=speed;
        if(top>600)top=-80;
        line.style.top=top+"px";
    });

    const enemies=document.querySelectorAll(".enemy");

    enemies.forEach(enemy=>{
        let top=parseInt(enemy.style.top);
        top+=speed;
        enemy.style.top=top+"px";

        if(collision(player,enemy)){
            endGame();
        }

        if(top>600){
            enemy.remove();
            score++;
            scoreText.textContent="Pontos: "+score;

            if(score%5===0)speed+=0.5;
        }
    });

    requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown",event=>{
    if(!gameRunning)return;

    if(event.key==="ArrowLeft"){
        playerX-=20;
        if(playerX<0)playerX=0;
        player.style.left=playerX+"px";
    }

    if(event.key==="ArrowRight"){
        playerX+=20;
        if(playerX>350)playerX=350;
        player.style.left=playerX+"px";
    }
});

setInterval(()=>{
    if(gameRunning)createEnemy();
},1200);

function endGame(){
    gameRunning=false;
    document.getElementById("finalScore").textContent="Pontuação: "+score;
    document.getElementById("gameOver").style.display="block";
}

function restartGame(){
    location.reload();
}

gameLoop();
</script>
</body>
</html>
